<template>
    <lightning-card title="Catalogo de Resgate" icon-name="utility:store">
        <div class="slds-p-around_medium">
            <template if:true={mensagem}>
                <p class={mensagemClass}>{mensagem}</p>
            </template>

            <!-- Grade de produtos -->
            <template if:true={emGrade}>
                <p class="slds-m-bottom_small">
                    Seu saldo atual: <strong>{saldoAtual} pontos</strong>
                </p>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={produtos} for:item="produto">
                        <div
                            key={produto.Id}
                            class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium"
                        >
                            <div class="slds-box slds-box_x-small slds-text-align_center" style="height:100%">
                                <template if:true={produto.Imagem_URL__c}>
                                    <img
                                        src={produto.Imagem_URL__c}
                                        alt={produto.Name}
                                        class="slds-m-bottom_x-small"
                                        style="max-width:100%;border-radius:4px"
                                    />
                                </template>
                                <p class="slds-text-heading_small">{produto.Name}</p>
                                <p class="slds-text-body_small slds-m-vertical_x-small">{produto.Descricao__c}</p>
                                <p class="slds-m-bottom_small"><strong>{produto.Custo_Pontos__c} pontos</strong></p>
                                <lightning-button
                                    variant="brand"
                                    label="Resgatar"
                                    data-id={produto.Id}
                                    onclick={handleAbrirCheckout}
                                ></lightning-button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Tela de checkout -->
            <template if:true={emCheckout}>
                <div class="slds-box slds-box_small" style="max-width:420px;margin:0 auto">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Confirmar resgate</h2>
                    <template if:true={produtoSelecionado.Imagem_URL__c}>
                        <img
                            src={produtoSelecionado.Imagem_URL__c}
                            alt={produtoSelecionado.Name}
                            style="max-width:100%;border-radius:4px"
                            class="slds-m-bottom_small"
                        />
                    </template>
                    <p class="slds-text-heading_small">{produtoSelecionado.Name}</p>
                    <p class="slds-m-vertical_x-small">{produtoSelecionado.Descricao__c}</p>

                    <div class="slds-m-vertical_medium">
                        <p>Custo do resgate: <strong>{produtoSelecionado.Custo_Pontos__c} pontos</strong></p>
                        <p>Seu saldo atual: <strong>{saldoAtual} pontos</strong></p>
                        <p>Saldo apos o resgate: <strong>{saldoAposResgate} pontos</strong></p>
                    </div>

                    <template if:true={saldoInsuficiente}>
                        <p class="slds-text-color_error slds-m-bottom_small">
                            Saldo insuficiente para este resgate.
                        </p>
                    </template>

                    <p class="slds-text-body_small slds-m-bottom_small">
                        Ao confirmar, voce recebe um codigo (QR code) para retirar o produto no caixa de
                        qualquer loja da rede, alem de uma copia por e-mail. Leve tambem um documento com
                        foto para conferencia.
                    </p>

                    <lightning-input
                        label="Documento (CPF ou RG)"
                        placeholder="Ex: 123.456.789-00"
                        value={documento}
                        required
                        class="slds-m-bottom_medium"
                        onchange={handleDocumentoChange}
                    ></lightning-input>

                    <div class="slds-grid slds-gutters">
                        <div class="slds-col">
                            <lightning-button
                                label="Cancelar"
                                onclick={handleCancelarCheckout}
                                disabled={resgatando}
                            ></lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button
                                variant="brand"
                                label="Confirmar Resgate"
                                onclick={handleConfirmarResgate}
                                disabled={confirmarDesabilitado}
                            ></lightning-button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Tela de confirmacao com QR code -->
            <template if:true={emConfirmacao}>
                <div class="slds-box slds-box_small slds-text-align_center" style="max-width:420px;margin:0 auto">
                    <lightning-icon icon-name="utility:success" variant="success" size="medium" class="slds-m-bottom_small"></lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">Resgate confirmado!</h2>
                    <p class="slds-m-bottom_medium">
                        Apresente o QR code abaixo (ou o codigo escrito) no caixa de qualquer loja da rede
                        para retirar <strong>{confirmacao.produtoNome}</strong>.
                    </p>
                    <img src={urlQrCode} alt="QR code de retirada" class="slds-m-bottom_small" />
                    <p class="slds-text-heading_small" style="letter-spacing:2px">{confirmacao.codigoRetirada}</p>
                    <p class="slds-text-body_small slds-m-vertical_small">
                        Enviamos uma copia deste codigo para o seu e-mail cadastrado.
                    </p>
                    <lightning-button
                        variant="brand"
                        label="Voltar ao Catalogo"
                        onclick={handleFecharConfirmacao}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
