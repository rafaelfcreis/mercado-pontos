<template>
    <lightning-card title="Catalogo de Resgate" icon-name="utility:store">
        <div class="slds-p-around_medium">
            <template if:true={mensagem}>
                <p class={mensagemClass}>{mensagem}</p>
            </template>
            <template for:each={produtos} for:item="produto">
                <div key={produto.Id} class="slds-box slds-m-bottom_small">
                    <template if:true={produto.Imagem_URL__c}>
                        <img src={produto.Imagem_URL__c} alt={produto.Name} class="slds-m-bottom_x-small" style="max-width:200px;display:block" />
                    </template>
                    <p class="slds-text-heading_small">{produto.Name}</p>
                    <p>{produto.Descricao__c}</p>
                    <p>{produto.Custo_Pontos__c} pontos</p>
                    <lightning-button
                        label="Resgatar"
                        data-id={produto.Id}
                        onclick={handleResgatar}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
